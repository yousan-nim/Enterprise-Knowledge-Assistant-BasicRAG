name: Backend CI
on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: knowledge
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: '5433'
      RUN_POSTGRES_TESTS: '1'
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Check whitespace and startup script
        run: |
          git diff --check
          sh -n scripts/dev.sh
          docker compose config --quiet
      - name: Start test database
        run: docker compose up -d --wait postgres
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -q
      - name: Build backend image
        run: docker compose build backend
      - name: Check real OCR tools in the image
        run: docker compose run --rm --no-deps -T -e RUN_OCR_TESTS=1 -e RUN_POSTGRES_TESTS=1 -e PYTHONPATH=backend -v "${{ github.workspace }}:/workspace:ro" -w /workspace backend python -m unittest discover -s backend/tests -p 'test_*.py' -q
      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop services
        if: always()
        run: docker compose down

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-dev.ps1
      - name: Verify launcher with PowerShell 7
        shell: pwsh
        run: ./scripts/test-dev.ps1
